# ═══════════════════════════════════════════════════════════════════
# Keep-alive ping for the Render backend.
# Render's free tier sleeps a service after ~15 min of inactivity, and
# the cold restart takes 30-60s. We ping every 10 min so the dyno stays
# awake and every real user request is instant.
# ═══════════════════════════════════════════════════════════════════

name: Keep backend awake

on:
  schedule:
    # Every 10 minutes. GitHub Actions may delay by a few minutes under
    # load — 10 min gives a healthy margin below Render's 15 min sleep.
    - cron: '*/10 * * * *'
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: |
          echo "Pinging Render backend to keep it awake..."
          # Hit the lightweight static-file route first (never invokes Gemini,
          # so it won't fail just because the AI backend is down). Any HTTP
          # response at all means Render is serving traffic = dyno awake.
          RESPONSE=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 60 \
            https://after12th-ai.onrender.com/ || echo "000")
          echo "HTTP status: $RESPONSE"
          head -c 300 /tmp/body 2>/dev/null || true
          echo ""
          if [[ "$RESPONSE" == "000" ]]; then
            echo "❌ Backend is completely unreachable (network / suspended)."
            exit 1
          fi
          # Any real HTTP response — even 500 — means the server is alive.
          # Warn on 5xx but don't fail the workflow.
          if [[ "$RESPONSE" =~ ^5 ]]; then
            echo "⚠️  Backend responded with $RESPONSE — dyno is awake but service is erroring."
          else
            echo "✅ Backend is awake ($RESPONSE)."
          fi
